<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridge mobile prototype</title><style>:root{--i:#d7d4cf;--p:#050505;--g:#d7d4cf;--m:#96918b}*{box-sizing:border-box}body{margin:0;background:#000;color:var(--i);font:clamp(1.12rem,2.2vw,1.5rem)/1.42 "Iowan Old Style","Palatino Linotype",Georgia,serif}main{width:min(940px,100%);min-height:100vh;margin:auto;padding:30px clamp(24px,6vw,70px) 42px;background:var(--p);box-shadow:0 0 45px #000}header{display:flex;justify-content:space-between;border-bottom:1px solid #343331;padding-bottom:13px}h1{margin:0;font:600 .68rem/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--g)}.muted{color:var(--m);font:.78rem/1.3 system-ui,sans-serif}.mode{display:flex;gap:8px;margin:20px 0 30px}button{border:1px solid #5d5a56;border-radius:3px;padding:9px 12px;font:600 .75rem/1 system-ui,sans-serif;letter-spacing:.04em;cursor:pointer}.mode button{background:transparent;color:var(--m)}.mode .on,.nav button{background:#d7d4cf;color:#080808}article{min-height:58vh}h2{font-size:clamp(1.65rem,3.2vw,2.45rem);font-weight:400;line-height:1.16;margin:0 0 24px}p{margin:0 0 21px}.callout{background:#17130d;border-left:3px solid #d3a44e;padding:10px 16px 10px 20px;margin:22px 0;color:#e8c77f;box-shadow:inset 0 0 26px #0b0906}.hand{background:#0c1012;border-left:2px solid #527486;border-radius:0;padding:15px 18px 15px 38px;margin:28px 0;font:400 clamp(1.35rem,2.7vw,2rem)/1.37 "Iowan Old Style","Palatino Linotype",Georgia,serif;white-space:pre-line;box-shadow:inset 0 0 30px #060707}.hand > span:not(.red):not(.q){color:#a9c9d8}.red{color:#e37870;text-shadow:0 0 12px #471814}.q{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;background:#211a0b;color:#efc86d;border:1px solid #d3a44e;border-radius:50%;font-weight:400}.answer{background:#151514;border:1px solid #4a4742;border-radius:0;padding:20px 22px;margin:24px 0}.nav{display:flex;justify-content:space-between;border-top:1px solid #343331;padding-top:20px}.nav button:disabled{background:transparent;border-color:#343331;color:#4d4a46}.reveal{background:transparent;color:#d7d4cf;border-color:#8e8981}</style><main><header><h1>Learn to Play Bridge · prototype</h1><span class="muted" id="count"></span></header><div class="mode"><button class="on" data-mode="lesson">Original flow</button><button data-mode="review">Quick review</button></div><article id="page"></article><nav class="nav"><button id="back">← Back</button><button id="next">Next →</button></nav></main><script>
const hand='<span>♠ A Q 9 8 7</span>\n<span class="red">♥ K 6 3 2</span>\n<span class="red">♦ 9</span>\n<span>♣ J 7 6</span>';
const lesson=[{title:'Responding to a 1 of a suit opening',text:"Your partner has opened the bidding and the next hand passes. You are the responder. When should you pass, and if you respond, how do you decide which bid to make? It depends on the opening bid, your strength, and your suit distribution."},{text:"The responder has two goals:",cards:["Discover the best trump suit, especially an 8-card major-suit fit.","Discover combined strength to judge partscore, game, small slam, or grand slam."]},{text:"Responder's task is usually more difficult after a 1-of-a-suit opening. Suppose partner opens 1♣ and you hold:",hand},{text:"You need more information about partner's strength and distribution before accurately placing the contract.",hand,answer:"It will probably come as no surprise to you that the correct response to your partner's 1♣ opening bid on this hand is 1♠. You have 5 cards in spades, a major suit, and if partner has 3 spades, the magic 8-card major suit fit will be present. By bidding 1♠ you are sending 2 messages to your partner:"},{text:"A widely accepted guideline:",cards:["With 6 or more total points, make some bid. With fewer than 6 total points, pass partner's opening bid."]}];
let mode='lesson',i=0,shown=false;const page=document.querySelector('#page'),count=document.querySelector('#count'),back=document.querySelector('#back'),next=document.querySelector('#next');function draw(){const list=mode==='lesson'?lesson:[lesson[3]],x=list[i];count.textContent=(i+1)+' / '+list.length;let h=x.title?'<h2>'+x.title+'</h2>':'';h+='<p>'+x.text+'</p>';if(x.hand)h+='<div class="hand">Partner: 1♣ &nbsp;<span class="q">?</span>\n\n'+x.hand+'</div>';if(x.answer&&!shown)h+='<button class="reveal" id="reveal">Think first · reveal answer</button>';if(x.answer&&shown)h+='<section class="answer"><strong>Answer: 1♠</strong><br>'+x.answer+'</section>';if(x.cards)h+=x.cards.map(t=>'<div class="callout">'+t+'</div>').join('');if(mode==='review')h+='<p class="muted">Original “? → next page → explanation” checkpoint, adapted for self-test.</p>';page.innerHTML=h;document.querySelector('#reveal')?.addEventListener('click',()=>{shown=true;draw()});back.disabled=i===0;next.disabled=i===list.length-1}back.onclick=()=>{if(i){i--;shown=false;draw()}};next.onclick=()=>{let x=(mode==='lesson'?lesson:[lesson[3]])[i];if(x.answer&&!shown){shown=true;draw()}else if(i<(mode==='lesson'?lesson:[lesson[3]]).length-1){i++;shown=false;draw()}};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;i=0;shown=false;document.querySelectorAll('[data-mode]').forEach(z=>z.classList.toggle('on',z===b));draw()});draw();</script>
